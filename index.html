<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TRPG Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a plain index of cards; add one <li> per new content folder */
:root {
  --bg: #f3f5f6; --surface: #ffffff; --ink: #1d2830; --muted: #5f6f7a; --line: #d5dce0; --accent: #1f6f78;
  --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12191d; --surface: #1b252b; --ink: #e5ecef; --muted: #93a3ad; --line: #2e3c44; --accent: #52b3bd; color-scheme: dark;
  }
}
:root[data-theme="dark"] { --bg: #12191d; --surface: #1b252b; --ink: #e5ecef; --muted: #93a3ad; --line: #2e3c44; --accent: #52b3bd; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 64px; }
header { padding: 36px 0 12px; }
h1 { font-family: var(--font-display); font-size: 1.8rem; margin: 0 0 6px; }
.lead { margin: 0; color: var(--muted); }
ul.cards { list-style: none; margin: 24px 0 0; padding: 0; display: grid; gap: 12px; }
ul.cards a { display: block; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 14px 16px; }
ul.cards a:hover { border-color: var(--accent); }
ul.cards a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.t { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; }
.d { color: var(--muted); font-size: .9rem; margin-top: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TRPG Playground</h1>
    <p class="lead">個人のTRPGコンテンツ置き場です。</p>
  </header>
  <ul class="cards">
    <li>
      <a href="gender-quiz/">
        <div class="t">探索者の性別どっちでしょう？</div>
        <div class="d">名前の読みを見て、男・女・不明を当てるクイズ。</div>
      </a>
    </li>
    <!-- 新しいコンテンツを足すときは、上の <li> をコピーしてリンク先と文章を書き換える -->
  </ul>
</div>
</body>
</html>
