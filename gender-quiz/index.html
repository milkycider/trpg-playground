<style>
/* Layout idea: sticky bar with progress and fixed hint counts, then one long ledger list; answers are revealed all at once after 答え合わせ */
:root {
  --bg: #f3f5f6;
  --surface: #ffffff;
  --ink: #1d2830;
  --muted: #5f6f7a;
  --line: #d5dce0;
  --accent: #1f6f78;
  --accent-ink: #ffffff;
  --done: #e6f2f1;
  --good: #1f6f78;
  --bad: #b4551d;
  --bad-bg: #fbece2;
  --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12191d; --surface: #1b252b; --ink: #e5ecef; --muted: #93a3ad; --line: #2e3c44;
    --accent: #52b3bd; --accent-ink: #0b1316; --done: #1b2f31; --good: #52b3bd;
    --bad: #e08a52; --bad-bg: #33241a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12191d; --surface: #1b252b; --ink: #e5ecef; --muted: #93a3ad; --line: #2e3c44;
  --accent: #52b3bd; --accent-ink: #0b1316; --done: #1b2f31; --good: #52b3bd;
  --bad: #e08a52; --bad-bg: #33241a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 820px; margin: 0 auto; padding: 0 16px 64px; }
header.top { padding: 28px 0 12px; }
h1 { font-family: var(--font-display); font-size: 1.7rem; margin: 0 0 6px; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); max-width: 65ch; }
[hidden] { display: none !important; }

button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 6px 12px; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: .9rem; color: var(--muted); cursor: pointer; }

.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 0; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.progress { flex: 1 1 260px; min-width: 220px; }
.progress .txt { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 14px; flex-wrap: wrap; align-items: baseline; }
.progress .txt b { color: var(--ink); font-weight: 700; }
.meter { height: 6px; background: var(--line); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.meter > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.hint { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0; padding: 0; list-style: none; }
.hint li { border: 1px solid var(--line); border-radius: 8px; padding: 2px 10px; background: var(--surface); font-variant-numeric: tabular-nums; font-size: .9rem; }
.hint b { font-size: 1.05rem; }
.hint-title { font-size: .8rem; color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

#result { scroll-margin-top: 150px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-top: 16px; }
.score { text-align: center; }
.score .big { font-family: var(--font-display); font-size: 3rem; line-height: 1.2; }
.score .pct { color: var(--muted); }
table.brk { border-collapse: collapse; width: 100%; max-width: 420px; margin: 14px auto 0; font-variant-numeric: tabular-nums; }
table.brk th, table.brk td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: right; }
table.brk th:first-child, table.brk td:first-child { text-align: left; }

ol.list { list-style: none; margin: 16px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
.row {
  display: grid; grid-template-columns: 2.4rem minmax(10rem, 1fr) auto minmax(7.5rem, auto);
  gap: 8px 12px; align-items: end; padding: 8px 12px 8px 0;
  border-bottom: 1px solid var(--line); border-left: 4px solid transparent;
}
.row:last-child { border-bottom: 0; }
.row.done { background: var(--done); border-left-color: var(--accent); }
.row.ng { background: var(--bad-bg); border-left-color: var(--bad); }
.row.ok { border-left-color: var(--good); }
.no { text-align: right; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; padding-bottom: 6px; }
.who { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
.part { display: flex; flex-direction: column; align-items: center; min-width: 2.2rem; }
.rd { font-size: .74rem; color: var(--muted); line-height: 1.4; min-height: 1.04rem; }
.nm { font-size: 1.15rem; font-weight: 500; overflow-wrap: anywhere; }
.g { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.g button { border: 0; border-radius: 0; padding: 6px 14px; background: var(--surface); min-width: 3rem; }
.g button + button { border-left: 1px solid var(--line); }
.g button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.g button:disabled { cursor: default; }
.g button.right { box-shadow: inset 0 0 0 2px var(--good); }
.g button[aria-pressed="true"].wrong { background: var(--bad); color: #fff; }
.res { font-weight: 700; padding-bottom: 6px; font-size: .9rem; }
.res.ok { color: var(--good); }
.res.ng { color: var(--bad); }
.note { color: var(--muted); font-size: .85rem; margin-top: 10px; }
@media (max-width: 680px) {
  .row { grid-template-columns: 2rem 1fr; grid-template-areas: "no who" ". g" ". res"; align-items: center; }
  .no { grid-area: no; align-self: start; padding-top: 18px; }
  .who { grid-area: who; }
  .g { grid-area: g; justify-self: start; }
  .res { grid-area: res; padding: 0; }
}
@media (prefers-reduced-motion: reduce) { .meter > i { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>城原の探索者の性別どっちでしょう？</h1>
    <p class="lead">日本人の探索者を名前の読み順に並べています。男・女・不明のボタンで全員ぶん答えて、最後に「答え合わせ」を押すと、答えと正答率が出ます。</p>
  </header>

  <div class="bar">
    <div class="progress" aria-live="polite">
      <div class="txt"><span>回答 <b id="ans">0</b> / <b id="tot">0</b></span><span class="hint-title">ヒント: 全員の人数</span></div>
      <div class="meter"><i id="meter"></i></div>
      <ul class="hint" id="hint"></ul>
    </div>
    <div class="tools">
      <label class="chk"><input type="checkbox" id="only"> <span id="onlyLabel">未回答だけ表示</span></label>
      <button type="button" id="grade" class="primary">答え合わせ</button>
      <button type="button" id="reset">最初からやり直す</button>
    </div>
  </div>

  <section class="card" id="result" hidden>
    <div class="score">
      <p class="pct" style="margin:0">結果</p>
      <div class="big" id="rScore"></div>
      <div class="pct" id="rPct"></div>
    </div>
    <table class="brk" aria-label="性別ごとの正解数">
      <thead><tr><th>正解の性別</th><th>人数</th><th>正解</th></tr></thead>
      <tbody id="brk"></tbody>
    </table>
  </section>

  <ol class="list" id="list"></ol>
  <p class="note" id="status"></p>
</div>

  var e = rowEls[i], a = answers[i], d = DATA[i];
  e.li.className = "row" + (graded ? (a === d[7] ? " ok" : " ng") : (a ? " done" : ""));
  Array.prototype.forEach.call(e.g.children, function (b) {
    var n = b.dataset.g;
    b.setAttribute("aria-pressed", a === n ? "true" : "false");
    b.disabled = graded;
    b.className = "";
    if (graded) {
      if (n === d[7]) b.classList.add("right");
      else if (n === a) b.classList.add("wrong");
    }
  });
  e.res.className = "res"; e.res.textContent = "";
  if (graded) {
    if (a === d[7]) { e.res.className = "res ok"; e.res.textContent = "正解"; }
    else { e.res.className = "res ng"; e.res.textContent = (a ? "不正解" : "未回答") + " 答え: " + d[7]; }
  }
}

function updateCounts() {
  var n = answers.filter(function (a) { return a; }).length;
  $("ans").textContent = n;
  $("tot").textContent = DATA.length;
  $("meter").style.width = (n / DATA.length * 100) + "%";
  $("grade").textContent = !graded && n < DATA.length ? "答え合わせ(未回答 " + (DATA.length - n) + ")" : "答え合わせ";
}

function applyFilter() {
  var only = $("only").checked;
  rowEls.forEach(function (e, i) {
    var show = true;
    if (only) show = graded ? answers[i] !== DATA[i][7] : !answers[i];
    e.li.hidden = !show;
  });
}

function doGrade() {
  graded = true;
  var ok = 0, byG = { "男": [0, 0], "女": [0, 0], "不明": [0, 0] }, blank = 0;
  DATA.forEach(function (d, i) {
    byG[d[7]][0]++;
    if (answers[i] === d[7]) { ok++; byG[d[7]][1]++; }
    if (!answers[i]) blank++;
    paintRow(i);
  });
  $("rScore").textContent = ok + " / " + DATA.length;
  $("rPct").textContent = "正答率 " + (ok / DATA.length * 100).toFixed(1) + "%" + (blank ? "(未回答 " + blank + "人は不正解として数えています)" : "");
  var tb = $("brk"); tb.innerHTML = "";
  GENDERS.forEach(function (g) {
    var tr = document.createElement("tr");
    [g, byG[g][0], byG[g][1]].forEach(function (v, i) {
      var c = document.createElement(i ? "td" : "th"); c.textContent = v; tr.appendChild(c);
    });
    tb.appendChild(tr);
  });
  $("result").hidden = false;
  $("grade").hidden = true;
  $("onlyLabel").textContent = "間違えた人だけ表示";
  $("only").checked = false;
  applyFilter(); updateCounts();
  $("result").scrollIntoView({ block: "start" });
}

function doReset() {
  graded = false;
  answers = DATA.map(function () { return ""; });
  save();
  $("result").hidden = true; $("grade").hidden = false;
  $("onlyLabel").textContent = "未回答だけ表示";
  $("only").checked = false;
  DATA.forEach(function (d, i) { paintRow(i); });
  applyFilter(); updateCounts();
  window.scrollTo(0, 0);
}

$("only").addEventListener("change", applyFilter);
$("grade").addEventListener("click", doGrade);
$("reset").addEventListener("click", doReset);
window.addEventListener("error", function (e) {
  var st = $("status");
  if (st) st.textContent = "エラー: " + e.message;
});

(function () {
  var c = countGender(DATA), h = $("hint");
  ["男", "女", "不明"].forEach(function (g) {
    var li = document.createElement("li");
    var b = document.createElement("b"); b.textContent = c[g];
    li.appendChild(document.createTextNode(g + " ")); li.appendChild(b); li.appendChild(document.createTextNode("人"));
    h.appendChild(li);
  });
  answers = load();
  build();
  DATA.forEach(function (d, i) { paintRow(i); });
  updateCounts();
})();
</script>
</body>
</html>
